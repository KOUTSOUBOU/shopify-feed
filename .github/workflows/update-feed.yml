name: Update Product Feed (Linkwise + Wolt)

on:
  schedule:
    - cron: '0 */3 * * *'     # κάθε 3 ώρες (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Generate feed
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_API_VERSION: '2024-10'
        run: |
          rm -rf site
          mkdir -p site
          python linkwise_feed.py
          mv feed.xml site/feed.xml

      - name: Verify feed is fresh
        run: |
          head -3 site/feed.xml
          echo "Products: $(grep -c '<product>' site/feed.xml)"
          TODAY=$(date -u +%Y-%m-%d)
          grep -q "<created_at>$TODAY" site/feed.xml \
            || { echo "::error::Το feed δεν έχει σημερινή ημερομηνία"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

