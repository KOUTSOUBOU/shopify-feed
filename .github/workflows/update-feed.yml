name: Update Product Feed (Linkwise + Wolt)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Generate feed
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_API_VERSION: '2024-10'
        run: python linkwise_feed.py

      - name: Verify feed is fresh
        run: |
          head -3 feed.xml
          COUNT=$(grep -c '<product>' feed.xml)
          echo "Products: $COUNT"
          [ "$COUNT" -ge 50 ] || { echo "::error::Πολύ λίγα προϊόντα ($COUNT)"; exit 1; }
          grep -q "<created_at>$(date -u +%Y-%m-%d)" feed.xml \
            || { echo "::error::Το feed δεν έχει σημερινή ημερομηνία"; exit 1; }

      - name: Commit feed (keeps cron alive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f feed.xml
          git diff --staged --quiet || git commit -m "Feed $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - name: Prepare deploy directory
        run: |
          rm -rf _deploy
          mkdir -p _deploy
          cp feed.xml _deploy/feed.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

